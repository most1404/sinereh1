name: v2ray_smart_app
description: مدیریت هوشمند کانفیگ‌های V2Ray با بروزرسانی خودکار ساب‌اسکریپشن، چند ساب‌اسکریپشن، تفکیک برنامه‌ها و سوییچ خودکار به سریع‌ترین سرور حین اتصال.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_v2ray_client: ^3.4.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  google_fonts: ^8.0.2
  installed_apps: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/logo.png"
